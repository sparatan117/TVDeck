name: Flatpak

# Builds TVDeck.flatpak on every push and pull request (download it from the
# run's "Artifacts"). Pushing a tag like v0.1.0 also publishes it on a
# GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.8
      options: --privileged
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: TVDeck.flatpak
          manifest-path: packaging/flatpak/io.github.sparatan117.TVDeck.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TVDeck.flatpak
          generate_release_notes: true
