name: Flatpak

# Builds TVDeck.flatpak on every push and pull request (download it from the
# run's "Artifacts").
#
# To release: Actions → Flatpak → Run workflow, enter a version like v0.1.0.
# That builds the selected branch, tags it and publishes a GitHub Release
# with the Flatpak attached. Pushing a v* tag does the same.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version to tag and publish (e.g. v0.1.0). Leave empty to only build.'
        required: false
        default: ''

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: TVDeck.flatpak
          manifest-path: packaging/flatpak/io.github.sparatan117.TVDeck.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: TVDeck.flatpak
          generate_release_notes: true

  # Flathub's own checks for the submission manifest and metainfo. Not
  # blocking yet: it will flag missing screenshots until they're added.
  flathub-lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install linter
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive flathub org.flatpak.Builder

      # Findings are also emitted as annotations so they show on the run
      # summary without opening the log.
      - name: Lint manifest
        run: |
          rc=0
          # The linter runs flatpak-builder, which needs a writable state dir
          # next to the manifest.
          cd packaging/flathub
          out=$(flatpak run --filesystem="$PWD" --command=flatpak-builder-lint org.flatpak.Builder \
                manifest io.github.sparatan117.TVDeck.yml 2>&1) || rc=$?
          echo "$out"
          echo "$out" | grep -E '"|error|warning' | sed 's/^/::warning title=Flathub lint (manifest)::/'
          exit $rc

      - name: Lint metainfo
        if: always()
        run: |
          rc=0
          out=$(flatpak run --filesystem="$PWD" --command=flatpak-builder-lint org.flatpak.Builder \
                appstream packaging/io.github.sparatan117.TVDeck.metainfo.xml 2>&1) || rc=$?
          echo "$out"
          echo "$out" | grep -E '"|error|warning' | sed 's/^/::warning title=Flathub lint (metainfo)::/'
          exit $rc
