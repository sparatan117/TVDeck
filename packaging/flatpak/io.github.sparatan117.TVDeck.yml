# Flatpak manifest for TVDeck.
#
# CI builds this on every push (.github/workflows/flatpak.yml). To build
# locally, run packaging/flatpak/build.sh.
#
# Qt WebEngine comes from Flathub's BaseApp so we don't rebuild Chromium.
# Netflix needs H.264/AAC: if video won't play, check that the pinned
# BaseApp is built with proprietary codecs.
app-id: io.github.sparatan117.TVDeck
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.8'
command: tvdeck
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Controllers (hidraw + evdev). --device=input needs flatpak >= 1.15.6.
  - --device=all
  - --talk-name=org.freedesktop.ScreenSaver
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: tvdeck
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - build-flatpak
          - .flatpak-builder
          - repo
